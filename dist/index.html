<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Un jardín para ti · Amarillo a rosa</title>
<meta name="description" content="Un pequeño jardín de flores amarillas que se transforma suavemente en rosado, para ti.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2309100d'/%3E%3Cg fill='%23f6cc56'%3E%3Cellipse cx='20' cy='13' rx='5' ry='9'/%3E%3Cellipse cx='13' cy='22' rx='9' ry='5'/%3E%3Cellipse cx='27' cy='22' rx='9' ry='5'/%3E%3Cellipse cx='20' cy='28' rx='5' ry='8'/%3E%3C/g%3E%3Ccircle cx='20' cy='21' r='5' fill='%23e994b9'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><a class="brand" href="./" aria-label="Un jardín para ti, inicio"><span class="flower-mark" aria-hidden="true">✳</span> UN JARDÍN PARA TI</a><span class="date">21 DE SEPTIEMBRE</span></header>
<main>
<div class="intro"><p class="eyebrow">UN PEQUEÑO GESTO QUE FLORECE</p><h1>Para ti, <em>en todos los colores.</em></h1><p class="dedication">Hay cosas bonitas que cambian. El cariño se queda.</p></div>
<div class="garden" id="garden"><canvas id="flowers" role="img" aria-label="Un jardín de flores amarillas cuyos pétalos se transforman gradualmente en rosados"></canvas><p class="loading" id="loading">Tu jardín está floreciendo…</p><div class="vignette"></div></div>
<section class="controls" aria-label="Transformación de las flores"><div class="range-labels"><span><i class="yellow"></i>Amarillo</span><span class="hint" id="hint">Deja que florezca</span><span>Rosado<i class="pink"></i></span></div><input id="color" type="range" min="0" max="100" value="0" aria-label="Transformación de amarillo a rosado" aria-valuetext="Flores amarillas"><div class="actions"><button id="play" type="button" aria-label="Pausar transformación"><span id="play-icon" aria-hidden="true">Ⅱ</span><span id="play-label">Pausar</span></button><button id="restart" type="button"><span aria-hidden="true">↺</span> Volver a florecer</button></div></section>
</main>
<footer>Unas flores. Una sonrisa. <span>Y un poquito de magia.</span><span class="footer-flower" aria-hidden="true">✳</span></footer>
<script src="app.js"></script>
</body></html>
